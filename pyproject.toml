[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eks-sre-agent"
version = "0.1.0"
description = "Read-only EKS production support and SRE agent"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
eks-sre-agent = "eks_sre_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
